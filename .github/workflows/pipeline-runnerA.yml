# Pipeline A — Access Key version (OIDC removed to get it working first).
name: pipeline-A
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: php-todo

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version/tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="sha-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}


      - name: Push to ECR
        run: docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}

      - name: Export full image ref
        id: out
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-scan-push
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests to K3s
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
          HOST: ${{ vars.APP_HOST }}
          KUBECONFIG: /home/ubuntu/.kube/config
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed -e "s#__IMAGE__#${IMAGE}#g" -e "s#__HOST__#${HOST}#g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n todo rollout status deploy/todo --timeout=120s
