# Pipeline A — deploy via a self-hosted runner installed ON the EC2/K3s box.
# Build + scan run on GitHub-hosted runners; deploy runs on your EC2 runner.
name: pipeline-A
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: php-todo

jobs:
  build-scan-push:
    runs-on: ubuntu-latest            # GitHub-hosted, free, does not touch your EC2
    permissions:
      id-token: write                  # for AWS OIDC
      contents: read
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version/tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="sha-${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
        
      - name: Debug GitHub Context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
             

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                   # load into the local docker so Scout can scan it
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}
          only-severities: critical,high
          exit-code: true              # fail the build on critical/high findings

      - name: Push to ECR
        run: docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}

      - name: Export full image ref
        id: out
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-scan-push
    runs-on: [self-hosted, k3s]        # your EC2 runner, labelled 'k3s'
    steps:
      - uses: actions/checkout@v4
      - name: Apply manifests to K3s
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
          HOST: ${{ vars.APP_HOST }}   # e.g. 3.107.165.84.sslip.io
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed -e "s#__IMAGE__#${IMAGE}#g" -e "s#__HOST__#${HOST}#g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n todo rollout status deploy/todo --timeout=120s
