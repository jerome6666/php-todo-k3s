# Minimal K3s manifests: Deployment + Service + Ingress (Traefik).
# One replica, tiny resource requests — fits a small EC2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo
  labels: { app: todo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: todo }
  template:
    metadata:
      labels: { app: todo }
    spec:
      imagePullSecrets:
        - name: ecr-secret
        
      containers:        
        - name: todo
          # CI replaces __IMAGE__ with the ECR image:tag during deploy.
          image: __IMAGE__
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "192Mi" }
          readinessProbe:
            httpGet:
              path: "/?action=health"
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/?action=health"
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # emptyDir = data lives as long as the pod. Fine for a demo.
        # For real persistence, swap to a PVC (local-path) — see tutorial.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: todo
  namespace: todo
spec:
  selector: { app: todo }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo
spec:
  ingressClassName: traefik
  rules:
    # Replace with your own host. sslip.io maps any IP to a hostname:
    #   <EC2_PUBLIC_IP>.sslip.io  ->  your EC2
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo
                port:
                  number: 80
